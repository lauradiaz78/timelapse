<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time-Lapse Creator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Generador de Time-Lapse</h1>
            <p>Capturá el momento, cuadro a cuadro.</p>
            
            <div class="status-indicator">
                <span id="statusLed" class="led gray"></span>
                <span id="statusText">Comprobando cámara...</span>
            </div>
        </header>

        <main>
            <div class="preview-section">
                <h2>Vista Previa en Vivo</h2>
                <!-- Como la URL es action=stream, en general el navegador lo renderiza directo en el img -->
                <div class="video-container">
                    <img id="cameraPreview" src="http://192.168.0.4/webcam/?action=stream" alt="Stream de la Cámara">
                </div>
            </div>

            <div class="controls-section">
                <div class="input-group">
                    <label for="interval">Intervalo entre capturas (segundos):</label>
                    <input type="number" id="interval" value="1" min="1" step="1">
                </div>

                <div class="button-group">
                    <button id="btnGrabar" class="btn primary">Iniciar Captura</button>
                    <button id="btnDetener" class="btn danger" disabled>Detener y Generar MP4</button>
                </div>
            </div>

            <div class="progress-section" id="progressSection" style="display: none;">
                <h2>Procesando Video...</h2>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p id="progressText">0%</p>
                <div id="downloadSection" style="display: none; margin-top: 1rem;">
                    <a id="downloadLink" href="#" download="timelapse.mp4" class="btn success">¡Listo che, descargar video!</a>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
